<!doctype html>
<html lang="en" data-auth="out">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Active Directory Web</title>
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

    <!-- Material Symbols (https://fonts.google.com/icons) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">

    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/site.css">
    <script src="/js/theme.js"></script>
    <script src="/js/login.js" defer></script>
</head>
<body>
<!-- Login screen from Web_Bergdahl_Template. Sign-in is checked against Active Directory by /api/auth/login. -->
<div class="login">
    <form class="login-card" data-login-form novalidate>
        <h1 class="login-title">
            <img class="app-icon" src="/assets/app-icon.svg" alt="" width="40" height="40">
            <span>Active Directory Web</span>
        </h1>
        <label class="field">
            <span>User name</span>
            <input name="username" type="text" autocomplete="username" required autofocus>
        </label>
        <label class="field">
            <span>Password</span>
            <input name="password" type="password" autocomplete="current-password">
        </label>
        <p class="field-error" data-login-error role="alert"></p>
        <button class="button" type="submit"><span class="icon">login</span>Sign in</button>
    </form>
</div>
</body>
</html>
